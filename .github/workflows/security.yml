name: Supply Chain Security

on:
  push:
    branches: [dev, staging, main]
  pull_request:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: '1'
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

jobs:
  scan:
    name: Static Repository Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run supply-chain security scan
        shell: bash
        run: bash scripts/security/supply-chain-scan.sh

      - name: Verify supply-chain scanner controls
        shell: bash
        run: bash scripts/security/supply-chain-scan.test.sh

  quality:
    name: Dependency, Type & Bundle Validation
    runs-on: ubuntu-latest
    needs: scan
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Verify dependency audit policy
        run: npm run test:audit-policy

      - name: Verify dependency compatibility adapter
        run: npm run test:dependency-compat

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Validate Expo dependency versions
        run: npx --no-install expo install --check

      - name: Type-check application
        run: npm run typecheck

      - name: Export application bundles
        run: npx --no-install expo export --output-dir "$RUNNER_TEMP/ohealth-mobile-export"

      - name: Verify repository was not modified
        if: always()
        run: git diff --exit-code -- .
